name: Java CI Build

# Kích hoạt khi có sự kiện push và pull_request
on: [push, pull_request]

jobs:
  build:
    # 1. Khai báo chiến lược Matrix
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # 2. Rút linh hoạt hệ điều hành từ ma trận ở trên
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package